name: Check Docs Folder
on: [push]
jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs folder exists
        run: |
          if [ -d "docs" ]; then
            echo "Docs folder exists!"
          else
            echo "Docs folder is missing!"
            exit 1
          fi
